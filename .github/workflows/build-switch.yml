name: Build Switch (CN)

on:
  push:
    branches:
      - cn-switch-port
  workflow_dispatch:

concurrency:
  group: build-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-switch:
    name: Build Switch .nro (Chinese)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package lists
        run: |
          dkp-pacman -Sy || true
          echo "=== all switch packages ==="
          dkp-pacman -Sl switch 2>/dev/null | grep -iE "vulkan|mesa|nvk|naga|gl|egl|gbm" || true
          echo "=== search vulkan ==="
          dkp-pacman -Ss vulkan 2>/dev/null || true
          echo "=== search mesa ==="
          dkp-pacman -Ss mesa 2>/dev/null || true

      - name: Install vulkan/mesa packages
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-vulkan switch-mesa switch-nvk 2>&1 || true

      - name: Find libvulkan.a
        run: |
          echo "=== all libvulkan files ==="
          find /opt/devkitpro -name "*vulkan*" 2>/dev/null || echo "none found"
          echo "=== portlibs/switch/lib ==="
          ls /opt/devkitpro/portlibs/switch/lib/ 2>/dev/null | grep -iE "vulkan|mesa|nvk" || echo "no vulkan in portlibs"

      - name: Configure CMake
        run: |
          . /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO=/opt/devkitpro
          VULKAN_ROOT=""
          if [ -f /opt/devkitpro/portlibs/switch/lib/libvulkan.a ]; then
            VULKAN_ROOT=/opt/devkitpro/portlibs/switch
          fi
          echo "NAGA_VULKAN_ROOT=$VULKAN_ROOT"
          cmake --preset switch-devkitA64-release \
            -DNAGA_VULKAN_ROOT="$VULKAN_ROOT"

      - name: Build
        run: |
          . /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO=/opt/devkitpro
          cmake --build --preset switch-devkitA64-release -j$(nproc)

      - name: Find output .nro
        run: |
          echo "=== searching for .nro ==="
          find build -name "*.nro" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-cn-switch-nro
          path: |
            build/**/*.nro
            build/**/*.elf
          if-no-files-found: warn
