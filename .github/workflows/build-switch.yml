name: Build Switch (NRO)

# Cross build for the console: devkitA64 + libnx + the Mesa Horizon Vulkan SDK.
# docs/dev/building-switch.md has the long form; this file is the same recipe on
# a clean runner. The toolchain comes from the devkitPro container image, which
# already ships cmake, git, sudo and dkp-pacman - no host-side installer, so
# nothing depends on apt.devkitpro.org (Cloudflare 403s GitHub runners).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "res/**"
      - "platforms/switch/**"
      - "cmake/**"
      - "mods/**"
      - "CMakeLists.txt"
      - "files.cmake"
      - "CMakePresets.json"
      - ".github/workflows/build-switch.yml"

concurrency:
  group: switch-nro-${{ github.ref }}
  cancel-in-progress: true

env:
  # Built by stefaniecheung-cmd/mesa-switch, workflow "Build Mesa Switch SDK".
  # It is a portlibs/switch prefix: lib/libvulkan.a is a complete static Vulkan
  # for Horizon (vk*, vk_icdGetInstanceProcAddr, VK_NN_vi_surface, its own winsys).
  MESA_SDK_URL: https://github.com/stefaniecheung-cmd/mesa-switch/releases/download/sdk-26.2.4/mesa-26.2.4-switch-unified-horizon-sdk.zip
  DEVKITPRO: /opt/devkitpro

jobs:
  nro:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 360
    # The image's /bin/sh is dash, and every step here wants pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the switch portlibs
        # The devkita64 image already ships the switch portlibs this build links
        # against, so the normal path touches no package database at all:
        # pkg.devkitpro.org sits behind Cloudflare, which 403s GitHub runners now
        # and then (run 42198744805), and dkp-pacman treats that as fatal. The
        # pacman call below only runs when the archives are actually absent, and
        # it may fail without taking the job with it.
        run: |
          set -uo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends ninja-build unzip zip

          libs="$DEVKITPRO/portlibs/switch/lib"
          count=$(find "$libs" -maxdepth 1 -name '*.a' 2>/dev/null | wc -l)
          echo "portlibs/switch/lib carries $count archives"

          if [ "$count" -lt 15 ]; then
            echo "too few archives; trying dkp-pacman (it may 403)"
            for attempt in 1 2 3; do
              sudo dkp-pacman -Sy --noconfirm && break
              echo "sync attempt $attempt failed"; sleep 20
            done
            for pkg in switch-zlib switch-libzstd switch-bzip2 switch-libexpat \
                       switch-libpng switch-libjpeg-turbo switch-libwebp \
                       switch-freetype switch-harfbuzz switch-curl ; do
              sudo dkp-pacman -S --noconfirm --needed "$pkg" >/tmp/dkp.log 2>&1 \
                || { echo "miss $pkg"; tail -3 /tmp/dkp.log; }
            done
            count=$(find "$libs" -maxdepth 1 -name '*.a' 2>/dev/null | wc -l)
            echo "portlibs/switch/lib now carries $count archives"
          fi

          echo "---- system tools ----"
          cmake --version | head -1
          ninja --version
          command -v unzip >/dev/null && echo "unzip ok"

      - name: Install the Mesa Horizon Vulkan SDK
        run: |
          set -euo pipefail
          curl -sSL "$MESA_SDK_URL" -o /tmp/mesa-sdk.zip
          unzip -q /tmp/mesa-sdk.zip -d /tmp/mesa-sdk
          cp -r /tmp/mesa-sdk/opt/devkitpro/portlibs/switch/. "$DEVKITPRO/portlibs/switch/"
          test -f "$DEVKITPRO/portlibs/switch/lib/libvulkan.a"
          # The archive ships an incomplete symbol index: its Rust core/alloc/std
          # members are in it but unindexed, so GNU ld reports ~4.5k undefined
          # core::panicking::* references at link time. Regenerating the index is
          # the whole fix, and it is the one step
          # platforms/switch/tools/reproduce-mesa-libvulkan.sh documents.
          aarch64-none-elf-ranlib -D "$DEVKITPRO/portlibs/switch/lib/libvulkan.a"
          ls -l "$DEVKITPRO/portlibs/switch/lib/libvulkan.a"

      - name: Configure
        run: |
          set -euo pipefail
          cmake --version
          # ALEKS2_NATIVE_MOD_LOADER: the static-mods preset leaves it off, but
          # platforms/switch expects the run-time loader's declarations
          # (aleks2_live_mod_threads, self_update) whichever way it is set, so the
          # release configuration is the one h37 uses: statics plus the loader.
          # The strict symbol manifest is off for the same reason h37 turns it off
          # - it is calibrated to one exact update, not to this combination.
          cmake --preset switch-devkitA64-release-h36 \
            -DNAGA_VULKAN_ROOT="$DEVKITPRO/portlibs/switch" \
            -DALEKS2_NATIVE_MOD_LOADER=ON \
            -DALEKS2_SYMBOL_CHECK_STRICT=OFF

      - name: Build
        run: |
          set -euo pipefail
          cmake --build --preset switch-devkitA64-release-h36 -- -k 0

      - name: Collect the NRO
        run: |
          set -euo pipefail
          nro=$(find build/switch-devkitA64-release-h36 -name 'dusklight.nro' -print -quit)
          if [ -z "$nro" ]; then
            echo "no dusklight.nro produced; build tree:" >&2
            find build -maxdepth 4 \( -name '*.nro' -o -name 'dusklight*' \) >&2
            exit 1
          fi
          mkdir -p dist
          cp "$nro" dist/dusklight.nro
          ls -lh dist/

      - name: Upload the NRO
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-nro-zh
          path: dist/dusklight.nro
          if-no-files-found: error
