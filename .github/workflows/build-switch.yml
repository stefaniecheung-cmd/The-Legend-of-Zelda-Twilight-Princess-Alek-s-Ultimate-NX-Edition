name: Build Switch (CN)

on:
  push:
    branches:
      - cn-switch-port
  workflow_dispatch:

concurrency:
  group: build-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-switch:
    name: Build Switch .nro (Chinese)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          pip3 install --break-system-packages mako pyyaml

      - name: Download NAGA Vulkan SDK
        run: |
          mkdir -p /tmp/naga-sdk
          curl -L -o /tmp/naga-sdk.zip \
            "https://github.com/${{ github.repository }}/releases/download/naga-sdk/naga-sdk.zip"
          cd /tmp/naga-sdk && unzip /tmp/naga-sdk.zip
          ls -la /tmp/naga-sdk/lib/libvulkan.a
          ls -la /tmp/naga-sdk/include/vulkan/vulkan.h

      - name: Configure CMake
        run: |
          . /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO=/opt/devkitpro
          cmake --preset switch-devkitA64-release \
            -DNAGA_VULKAN_ROOT=/tmp/naga-sdk \
            -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Build
        run: |
          . /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO=/opt/devkitpro
          cmake --build --preset switch-devkitA64-release -j$(nproc)

      - name: Find output .nro
        run: |
          find build -name "*.nro" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-cn-switch-nro
          path: |
            build/**/*.nro
            build/**/*.elf
          if-no-files-found: warn
