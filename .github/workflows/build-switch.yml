name: Build Switch (CN)

on:
  push:
    branches:
      - cn-switch-port
  workflow_dispatch:

concurrency:
  group: build-switch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-switch:
    name: Build Switch .nro (Chinese)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List available packages
        run: |
          echo "=== pacman system packages ==="
          pacman -Ss cmake ninja python3 2>/dev/null | head -20 || true
          echo "=== dkp-pacman switch portlibs ==="
          dkp-pacman -Sl switch 2>/dev/null | head -50 || true
          echo "=== search mesa/vulkan ==="
          dkp-pacman -Ss mesa 2>/dev/null || true
          dkp-pacman -Ss vulkan 2>/dev/null || true
          echo "=== already installed? ==="
          which cmake ninja python3 git make 2>/dev/null || true

      - name: Install system tools
        run: |
          pacman -S --noconfirm --needed cmake ninja python3 make git zip unzip 2>/dev/null || true

      - name: Install switch portlibs
        run: |
          # Install whatever switch portlibs are available
          dkp-pacman -S --noconfirm --needed \
            switch-zlib switch-zstd switch-bzip2 switch-libpng \
            switch-freetype switch-harfbuzz switch-curl switch-mbedtls \
            2>&1 || true
          echo "=== verify what got installed ==="
          ls /opt/devkitpro/portlibs/switch/lib/ 2>/dev/null | head -30 || echo "no portlibs"

      - name: Find libvulkan.a
        run: |
          echo "=== searching for libvulkan.a ==="
          find /opt/devkitpro -name "libvulkan.a" 2>/dev/null || echo "not found"
          echo "=== searching for vulkan headers ==="
          find /opt/devkitpro -path "*/vulkan/vulkan.h" 2>/dev/null || echo "not found"

      - name: Configure CMake
        run: |
          source /etc/profile.d/devkit-env.sh
          export DEVKITPRO=/opt/devkitpro
          VULKAN_ROOT=""
          if [ -f /opt/devkitpro/portlibs/switch/lib/libvulkan.a ]; then
            VULKAN_ROOT=/opt/devkitpro/portlibs/switch
          fi
          echo "NAGA_VULKAN_ROOT=$VULKAN_ROOT"
          cmake --preset switch-devkitA64-release \
            -DNAGA_VULKAN_ROOT="$VULKAN_ROOT"

      - name: Build
        run: |
          source /etc/profile.d/devkit-env.sh
          export DEVKITPRO=/opt/devkitpro
          cmake --build --preset switch-devkitA64-release -j$(nproc)

      - name: Find output .nro
        run: |
          echo "=== searching for .nro ==="
          find build -name "*.nro" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-cn-switch-nro
          path: |
            build/**/*.nro
            build/**/*.elf
          if-no-files-found: warn
