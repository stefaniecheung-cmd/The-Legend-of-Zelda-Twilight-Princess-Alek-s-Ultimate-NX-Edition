name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_VERSION: v1.1.0-cn
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-24.04
            preset: gcc
            artifact_arch: x86_64
          - name: GCC aarch64
            runner: ubuntu-24.04-arm
            preset: gcc
            artifact_arch: aarch64
          # - name: Clang x86_64
          #   runner: ubuntu-latest
          #   preset: clang
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld mold openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Print sccache stats
        run: sccache --show-stats


      - name: Configure CMake
        run: cmake --preset x-linux-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-linux-${{matrix.preset}}-${{matrix.artifact_arch}}
          path: |
            build/install/Dusklight-*.AppImage
            build/install/debug.tar.*
            build/install/sdk/

  build-apple:
    name: Build Apple (${{matrix.name}})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64
          - name: AppleClang macOS x86_64
            platform: macos
            preset: x-macos-ci-x86_64
            artifact_name: macos-appleclang-x86_64
          - name: AppleClang iOS arm64
            platform: ios
            preset: x-ios-ci
            artifact_name: ios-appleclang-arm64
          # - name: AppleClang tvOS arm64
          #   platform: tvos
          #   preset: x-tvos-ci
          #   artifact_name: tvos-appleclang-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust iOS target
        if: matrix.platform == 'ios'
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-ios

      - name: Install Rust tvOS target
        if: matrix.platform == 'tvos'
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly aarch64-apple-tvos

      - name: Install Rust x86_64 macOS target
        if: endsWith(matrix.preset, 'x86_64')
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-${{matrix.artifact_name}}
          path: |
            build/install/Dusklight.app
            build/install/debug.tar.*
            build/install/sdk/

  build-android:
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusklight

      - name: Build bundled mods
        run: cmake --build --preset ${{matrix.preset}} --target dusklight_mods

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Stage artifacts
        run: |
          mkdir -p upload/sdk
          cp build/*/stub-android-*.so upload/sdk/
          cp platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-android-${{matrix.artifact_arch}}
          path: upload/

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            # windows-latest is the windows-2025 image, whose MSVC 14.51 dies
            # on the first batch of abseil TUs with C1083 "Cannot open compiler
            # generated file: ''" -- deterministically, seconds into the build,
            # on three different files. Nothing in the command line is at
            # fault, so build on the windows-2022 image and its stable MSVC
            # 14.4x toolchain instead.
            runner: windows-2022
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          # Windows on ARM is not a target anyone asked for, and the runner's
          # ARM64 toolchain cannot even pass CMake's compiler probe: rc.exe
          # rejects the generated manifest.rc with
          #   RC2136: missing '=' in EXSTYLE=<flags>
          # before a single line of the game is compiled. Left out of the matrix
          # rather than papered over with a patched SDK.
          # - name: MSVC arm64
          #   runner: windows-latest
          #   preset: arm64-msvc
          #   msvc_arch: amd64_arm64
          #   vcpkg_arch: arm64
          #   artifact_arch: arm64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      # sentry_native pulls google/benchmark as a submodule, and the checkout
      # path is long enough that git aborts with "Filename too long" unless
      # long paths are enabled before the clone starts.
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows

      # The runner checks the repo out at
      # D:\a\<76-char repo name>\<76-char repo name>\... and the abseil
      # objects land under _deps\abseil-cpp-build\absl\...\CMakeFiles\
      # <target>.dir\internal\<file>.cc.obj -- combined that is past
      # MAX_PATH (260). cl then dies deterministically with
      # C1083 "Cannot open compiler generated file: ''" on the same four
      # longest paths, on both the windows-2022 and windows-2025 images,
      # with every debug-format setting. Configure and build through a
      # short junction instead; the artifacts still upload from the
      # workspace path, which stays shallow.
      - name: Create short junction
        shell: pwsh
        run: |
          if (Test-Path C:\w) { cmd /c rmdir C:\w }
          New-Item -ItemType Junction -Path C:\w -Target $env:GITHUB_WORKSPACE | Out-Null
          Get-Item C:\w | Select-Object FullName, LinkType, Target

      - name: Configure CMake
        working-directory: C:\w
        # sentry_native pulls a chain of submodules whose clone dies with
        # "fatal: '$GIT_DIR' too big" on the runner's deep build path; crash
        # reporting is useless for this fork, so leave it out entirely.
        # sccache + MSVC on the runner abort abseil with
        # "fatal error C1083: Cannot open compiler generated file: ''":
        # the wrapper hands cl a blank temp path. Linux and Apple keep the
        # cache; Windows builds without it.
        run: >
          cmake --preset x-windows-ci-${{matrix.preset}}
          -D BOREALIS_ENABLE_SENTRY=OFF
          -D CMAKE_C_COMPILER_LAUNCHER=
          -D CMAKE_CXX_COMPILER_LAUNCHER=

      # The retry is a safety net only: round 10 confirmed the C1083 came from
      # MAX_PATH overflow, which the junction above removes. Keep the second
      # pass anyway -- it is incremental and cheap when the first one is green.
      - name: Build
        working-directory: C:\w
        shell: pwsh
        run: |
          cmake --build --preset x-windows-ci-${{matrix.preset}}
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::first build pass failed, retrying once"
            cmake --build --preset x-windows-ci-${{matrix.preset}}
          }
          exit $LASTEXITCODE

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
            build/install/mods/
            build/install/debug.7z
            build/install/sdk/
