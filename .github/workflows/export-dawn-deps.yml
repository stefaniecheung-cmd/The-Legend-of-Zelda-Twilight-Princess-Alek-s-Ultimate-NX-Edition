name: Export Dawn deps (offline)

# One-shot helper for building the Switch NRO on a Windows/MSYS2 host.
# It runs exactly the same configure step as build-switch.yml - which makes
# FetchContent pull encounter/dawn and makes Dawn's own
# fetch_dawn_dependencies.py shallow-clone its 14+ third_party checkouts from
# chromium.googlesource.com - then hands the resulting source tree back as an
# artifact, with both Horizon patches already applied.
#
# On the Windows host, point -DFETCHCONTENT_SOURCE_DIR_DAWN at the unpacked
# dawn-src and pass -DDAWN_FETCH_DEPENDENCIES=OFF: configure then never needs
# to reach a Google source. See /c/swh/tp/configure_local.sh.
#
# workflow_dispatch only, on purpose: committing this file must not kick off a
# full cross build, and the ordinary NRO workflow is left untouched.

on:
  workflow_dispatch:
    inputs:
      exclude_vcs:
        description: "Drop nested .git directories from the tarball"
        type: boolean
        default: true

concurrency:
  group: export-dawn-deps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Built by stefaniecheung-cmd/mesa-switch, workflow "Build Mesa Switch SDK".
  MESA_SDK_URL: https://github.com/stefaniecheung-cmd/mesa-switch/releases/download/sdk-26.2.4/mesa-26.2.4-switch-unified-horizon-sdk.zip
  DEVKITPRO: /opt/devkitpro

jobs:
  deps:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 180
    # The image's /bin/sh is dash, and every step here wants pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the switch portlibs
        run: |
          set -uo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends ninja-build unzip zip

          libs="$DEVKITPRO/portlibs/switch/lib"
          count=$(find "$libs" -maxdepth 1 -name '*.a' 2>/dev/null | wc -l)
          echo "portlibs/switch/lib carries $count archives"

          if [ "$count" -lt 15 ]; then
            echo "too few archives; trying dkp-pacman (it may 403)"
            for attempt in 1 2 3; do
              sudo dkp-pacman -Sy --noconfirm && break
              echo "sync attempt $attempt failed"; sleep 20
            done
            for pkg in switch-zlib switch-libzstd switch-bzip2 switch-libexpat \
                       switch-libpng switch-libjpeg-turbo switch-libwebp \
                       switch-freetype switch-harfbuzz switch-curl ; do
              sudo dkp-pacman -S --noconfirm --needed "$pkg" >/tmp/dkp.log 2>&1 \
                || { echo "miss $pkg"; tail -3 /tmp/dkp.log; }
            done
          fi

          cmake --version | head -1
          ninja --version

      - name: Install the Mesa Horizon Vulkan SDK
        run: |
          set -euo pipefail
          curl -sSL "$MESA_SDK_URL" -o /tmp/mesa-sdk.zip
          unzip -q /tmp/mesa-sdk.zip -d /tmp/mesa-sdk
          cp -r /tmp/mesa-sdk/opt/devkitpro/portlibs/switch/. "$DEVKITPRO/portlibs/switch/"
          test -f "$DEVKITPRO/portlibs/switch/lib/libvulkan.a"
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          ranlib=$(command -v aarch64-none-elf-ranlib || command -v ranlib || true)
          if [ -z "$ranlib" ]; then
            echo "no ranlib found" >&2; ls "$DEVKITPRO/tools/bin" | head -30; exit 1
          fi
          "$ranlib" -D "$DEVKITPRO/portlibs/switch/lib/libvulkan.a" \
            || "$ranlib" "$DEVKITPRO/portlibs/switch/lib/libvulkan.a"

      - name: Configure (this is what fetches the Dawn dependencies)
        run: |
          set -euo pipefail
          cmake --version
          cmake --preset switch-devkitA64-release-h36 \
            -DNAGA_VULKAN_ROOT="$DEVKITPRO/portlibs/switch" \
            -DALEKS2_NATIVE_MOD_LOADER=ON \
            -DALEKS2_SYMBOL_CHECK_STRICT=OFF \
            -DDUSK_APP_VERSION_OVERRIDE=v1.1.1-cn

      - name: Package the Dawn source tree
        env:
          EXCLUDE_VCS: ${{ inputs.exclude_vcs }}
        run: |
          set -euo pipefail
          deps=build/switch-devkitA64-release-h36/_deps
          dawn="$deps/dawn-src"

          # configure succeeded, so these must be populated; fail loudly if a
          # future Dawn revision moves them instead of shipping a broken tarball.
          for d in third_party/abseil-cpp third_party/vulkan-headers/src \
                   third_party/spirv-headers/src third_party/spirv-tools/src; do
            test -d "$dawn/$d" || { echo "missing dependency: $d" >&2; exit 1; }
          done
          test -f "$dawn/patches/abseil-cpp.patch"

          echo "---- Dawn tree ----"
          du -sh "$dawn"
          du -sh "$dawn"/third_party/* 2>/dev/null | sort -h | tail -20 || true

          tar_args=(-czf "$RUNNER_TEMP/dawn-offline.tar.gz")
          if [ "$EXCLUDE_VCS" = "true" ]; then
            # --exclude-vcs drops the 14+ nested .git dirs. They are only used
            # by fetch_dawn_dependencies.py, which the offline host disables.
            tar_args=(--exclude-vcs "${tar_args[@]}")
          fi
          tar "${tar_args[@]}" -C "$deps" dawn-src

          ls -lh "$RUNNER_TEMP/dawn-offline.tar.gz"
          sha256sum "$RUNNER_TEMP/dawn-offline.tar.gz" \
            | tee "$RUNNER_TEMP/dawn-offline.sha256"

      - name: Package the remaining FetchContent source trees
        run: |
          set -euo pipefail
          cd build/switch-devkitA64-release-h36/_deps
          # Every FetchContent_Declare lands in <lowercase-name>-src. Dawn has
          # its own artifact and SDL downloads fine on Windows, so ship the
          # rest. Windows CMake cannot extract some of these tarballs itself
          # (zstd ships a symlink, freetype hits file(RENAME) Permission denied),
          # hence --dereference: symlinks become plain files in the tarball.
          mapfile -t srcs < <(find . -maxdepth 1 -type d -name '*-src' \
            ! -name 'dawn-src' ! -name 'sdl-src' -printf '%f\n' | sort)
          printf '%s\n' "${srcs[@]}"
          [ "${#srcs[@]}" -gt 0 ] || { echo "no FetchContent source trees" >&2; exit 1; }
          du -sh "${srcs[@]}" | sort -h
          tar --exclude-vcs --dereference -czf "$RUNNER_TEMP/aurora-deps.tar.gz" "${srcs[@]}"
          ls -lh "$RUNNER_TEMP/aurora-deps.tar.gz"
          sha256sum "$RUNNER_TEMP/aurora-deps.tar.gz"

      - name: Package the switch-curl portlib
        run: |
          set -euo pipefail
          root="$DEVKITPRO/portlibs/switch"
          test -f "$root/lib/libcurl.a" || {
            echo "libcurl.a missing" >&2
            find "$root/lib" -maxdepth 1 -name '*.a' | head -40 >&2
            exit 1
          }
          files=(lib/libcurl.a include/curl)
          [ -f "$root/lib/pkgconfig/libcurl.pc" ] && files+=(lib/pkgconfig/libcurl.pc)
          tar -czf "$RUNNER_TEMP/switch-curl-portlib.tar.gz" -C "$root" "${files[@]}"
          ls -lh "$RUNNER_TEMP/switch-curl-portlib.tar.gz"

      - name: Package the remaining Switch codec portlibs
        run: |
          set -euo pipefail
          root="$DEVKITPRO/portlibs/switch"
          # Ship every static portlib except the 91 MB Mesa libvulkan.a (the
          # offline host already has that one). A Windows devkitPro install is
          # missing most of these, and each one otherwise costs another
          # configure/build round trip at link time.
          mapfile -t libs < <(find "$root/lib" -maxdepth 1 -name '*.a' \
            ! -name 'libvulkan.a' -printf 'lib/%f\n' | sort)
          [ "${#libs[@]}" -gt 0 ] || { echo "no portlib archives" >&2; exit 1; }
          for lib in zstd bz2 lzma expat; do
            test -f "$root/lib/lib${lib}.a" || { echo "missing lib${lib}.a" >&2; exit 1; }
          done
          tar -czf "$RUNNER_TEMP/switch-codec-portlibs.tar.gz" -C "$root" \
            "${libs[@]}" include
          echo "packaged ${#libs[@]} archives"
          ls -lh "$RUNNER_TEMP/switch-codec-portlibs.tar.gz"

      - name: Upload the Dawn tree
        uses: actions/upload-artifact@v4
        with:
          name: dawn-offline
          path: ${{ runner.temp }}/dawn-offline.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the remaining FetchContent source trees
        uses: actions/upload-artifact@v4
        with:
          name: aurora-deps-offline
          path: ${{ runner.temp }}/aurora-deps.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the switch-curl portlib
        uses: actions/upload-artifact@v4
        with:
          name: switch-curl-portlib
          path: ${{ runner.temp }}/switch-curl-portlib.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload the Switch codec portlibs
        uses: actions/upload-artifact@v4
        with:
          name: switch-codec-portlibs
          path: ${{ runner.temp }}/switch-codec-portlibs.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
